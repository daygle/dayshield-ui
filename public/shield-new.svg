<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="chromeRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#cbd5e1"/>
      <stop offset="50%" stop-color="#94a3b8"/>
      <stop offset="70%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>

    <linearGradient id="shield3D" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="40%" stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <linearGradient id="matrixCore" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="60%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#eab308"/>
    </linearGradient>

    <filter id="cyberGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <path d="M 130 160 L 250 110 L 370 160 L 360 290 C 360 380, 250 430, 250 430 C 250 430, 140 380, 130 290 Z" 
        fill="#3b82f6" opacity="0.15" filter="url(#cyberGlow)"/>

  <g stroke="#22d3ee" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.75">
    <path d="M 100 240 L 50 260 L 70 310"/>
    <path d="M 120 320 L 80 350 L 105 390"/>
    <path d="M 400 240 L 450 260 L 430 310"/>
    <path d="M 380 320 L 420 350 L 395 390"/>
  </g>
  <g fill="#22d3ee" filter="url(#cyberGlow)">
    <circle cx="50" cy="260" r="5.5" /> <circle cx="70" cy="310" r="5.5" />
    <circle cx="80" cy="350" r="5.5" /> <circle cx="105" cy="390" r="5.5" />
    <circle cx="450" cy="260" r="5.5" /> <circle cx="430" cy="310" r="5.5" />
    <circle cx="420" cy="350" r="5.5" /> <circle cx="395" cy="390" r="5.5" />
  </g>

  <g fill="#fbbf24" filter="url(#cyberGlow)">
    <path d="M 250 35 L 300 90 L 200 90 Z" />
    <path d="M 180 65 L 210 45 L 215 70 Z" />
    <path d="M 140 95 L 175 75 L 180 100 Z" />
    <path d="M 320 65 L 290 45 L 285 70 Z" />
    <path d="M 360 95 L 325 75 L 320 100 Z" />
  </g>

  <path d="M 120 150 L 250 100 L 380 150 L 370 290 C 370 380, 250 440, 250 440 C 250 440, 130 380, 120 290 Z" 
        fill="url(#chromeRim)"/>

  <path d="M 130 162 L 250 115 L 370 162 L 360 285 C 360 370, 250 425, 250 425 C 250 425, 140 370, 130 285 Z" 
        fill="#0f172a"/>

  <path d="M 142 172 L 250 127 L 358 172 L 348 280 C 348 355, 250 410, 250 410 C 250 410, 152 355, 142 280 Z" 
        fill="url(#shield3D)"/>

  <path d="M 142 172 L 250 127 L 358 172 L 338 195 L 250 155 L 162 195 Z" fill="#ffffff" opacity="0.2"/>
  <path d="M 162 195 L 250 155 L 338 195 L 328 270 C 328 330, 250 380, 250 380 C 250 380, 172 330, 162 270 Z" fill="none" stroke="#60a5fa" stroke-width="1.5" opacity="0.4"/>

  <path d="M 210 205 L 255 205 A 55 55 0 0 1 255 315 L 210 315 Z" fill="#064e3b" opacity="0.9"/>
  
  <path d="M 205 200 L 260 200 A 60 60 0 0 1 260 320 L 205 320 Z" fill="none" stroke="#22c55e" stroke-width="2" filter="url(#cyberGlow)" opacity="0.7"/>

  <path d="M 218 213 L 255 213 A 47 47 0 0 1 255 307 L 218 307 Z" fill="url(#matrixCore)" filter="url(#cyberGlow)"/>

  <path d="M 218 240 L 245 240 A 18 18 0 0 1 245 280 L 218 280 Z" fill="#1d4ed8"/>
  
  <path d="M 275 240 A 25 25 0 0 1 275 280" fill="none" stroke="#22d3ee" stroke-width="3" stroke-linecap="round" filter="url(#cyberGlow)"/>
</svg>
