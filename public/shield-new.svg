<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500">
  <defs>
    <!-- Define the gradient for the central "D" -->
    <linearGradient id="gradient_d" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#38ef7d;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ffce00;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Dark blue-grey background -->
  <rect width="100%" height="100%" fill="#2f4158"/>

  <!-- Main shield body -->
  <path d="M 120 120 L 250 80 L 380 120 L 380 250 C 380 350, 250 420, 250 420 C 250 420, 120 350, 120 250 Z" fill="#4d8df1"/>
  
  <!-- Outer light silver border/spikes -->
  <path d="M 100 130 L 250 70 L 400 130 L 390 250 C 390 350, 250 430, 250 430 C 250 430, 110 350, 100 250 Z" fill="#d9e3ed"/>
  
  <!-- Internal light blue geometric panels -->
  <path d="M 140 140 L 250 100 L 360 140 L 360 250 C 360 330, 250 390, 250 390 C 250 390, 140 330, 140 250 Z" fill="#75b3fd"/>

  <!-- Top star/crown elements -->
  <path d="M 190 70 L 250 20 L 310 70 L 290 80 L 210 80 Z" fill="#fbb034"/>
  <path d="M 150 90 L 190 60 L 220 90 Z" fill="#fbb034"/>
  <path d="M 350 90 L 310 60 L 280 90 Z" fill="#fbb034"/>
  <path d="M 120 110 L 160 80 L 190 110 Z" fill="#fbb034"/>
  <path d="M 380 110 L 340 80 L 310 110 Z" fill="#fbb034"/>
  
  <!-- Dark central border structure -->
  <path d="M 230 150 C 200 170, 200 250, 230 270 L 270 270 C 300 250, 300 170, 270 150 Z" fill="#202c3c"/>

  <!-- Stylized inner "D" -->
  <path d="M 240 160 C 210 180, 210 240, 240 260 L 260 260 C 290 240, 290 180, 260 160 Z" fill="url(#gradient_d)"/>

  <!-- Left intricate design -->
  <path d="M 220 170 C 200 190, 200 230, 220 250 L 210 210 Z" fill="#4d8df1"/>

  <!-- Circuit traces -->
  <g fill="none" stroke="#68f442" stroke-width="2">
    <path d="M 140 200 L 100 220 L 110 260"/>
    <path d="M 360 200 L 400 220 L 390 260"/>
    <path d="M 160 270 L 120 300 L 140 340"/>
    <path d="M 340 270 L 380 300 L 360 340"/>
    <path d="M 190 330 L 160 350 L 180 380"/>
    <path d="M 310 330 L 340 350 L 320 380"/>
  </g>
  
  <!-- Circuit nodes -->
  <g fill="#68f442">
    <circle cx="100" cy="220" r="5"/>
    <circle cx="400" cy="220" r="5"/>
    <circle cx="120" cy="300" r="5"/>
    <circle cx="380" cy="300" r="5"/>
    <circle cx="160" cy="350" r="5"/>
    <circle cx="340" cy="350" r="5"/>
    <circle cx="180" cy="380" r="5"/>
    <circle cx="320" cy="380" r="5"/>
  </g>
</svg>
