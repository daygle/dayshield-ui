<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="100%" stop-color="#07070c"/>
    </linearGradient>

    <linearGradient id="outerShieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="50%" stop-color="#0072ff"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <linearGradient id="innerCoreGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff007f"/>
      <stop offset="60%" stop-color="#ff7300"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>

    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="100%" height="100%" fill="url(#bgGrad)" rx="32"/>

  <g transform="translate(0, 8)">
    <g opacity="0.15" stroke="#00f2fe" stroke-width="2" stroke-dasharray="4 8">
      <path d="M 120 150 L 392 150" />
      <path d="M 90 240 L 422 240" />
      <path d="M 120 330 L 392 330" />
      <path d="M 170 410 L 342 410" />
      <path d="M 256 60 L 256 440" />
    </g>

    <path d="M 240 70 
             L 110 115 
             C 100 230, 120 340, 240 435 
             L 240 375 
             C 160 300, 150 210, 160 145 
             L 240 118 Z" 
          fill="url(#outerShieldGrad)" 
          opacity="0.85"/>

    <path d="M 272 70 
             L 402 115 
             C 412 230, 392 340, 272 435 
             L 272 375 
             C 352 300, 362 210, 352 145 
             L 272 118 Z" 
          fill="url(#outerShieldGrad)" 
          opacity="0.85"/>

    <path d="M 256 125 
             C 210 125, 190 150, 190 200 
             C 190 280, 210 330, 256 375 
             C 302 330, 322 280, 322 200
             C 322 150, 302 125, 256 125 Z" 
          fill="url(#innerCoreGrad)" 
          filter="url(#neonGlow)"/>

    <path d="M 256 155 
             L 215 200 
             L 215 240 
             L 256 185 
             L 297 240 
             L 297 200 Z" 
          fill="#0a0f1d" 
          opacity="0.4"/>
          
    <path d="M 215 265 
             C 215 300, 230 325, 256 348 
             C 282 325, 297 300, 297 265
             L 280 265
             C 280 285, 270 305, 256 320
             C 242 305, 232 285, 232 265 Z" 
          fill="#0a0f1d" 
          opacity="0.5"/>

    <path d="M 240 70 L 110 115 L 125 120 L 240 80 Z" fill="#ffffff" opacity="0.4"/>
    <path d="M 272 70 L 402 115 L 387 120 L 272 80 Z" fill="#ffffff" opacity="0.4"/>
  </g>
</svg>