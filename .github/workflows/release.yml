name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.2.3) - used as the artifact version label when triggered manually'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build and publish UI artifact
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Resolve release tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "value=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build UI
        env:
          GITHUB_RELEASE_TAG: ${{ steps.tag.outputs.value }}
        run: npm run build

      - name: Package artifact
        run: |
          TAG="${{ steps.tag.outputs.value }}"
          ARTIFACT="ui-${TAG}.tar.zst"
          tar --use-compress-program="zstd -T0 -19" -cf "${ARTIFACT}" -C dist .
          sha256sum "${ARTIFACT}" > "${ARTIFACT}.sha256"
          echo "artifact=${ARTIFACT}" >> "$GITHUB_ENV"
          echo "sha256=${ARTIFACT}.sha256" >> "$GITHUB_ENV"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.value }}
          name: UI ${{ steps.tag.outputs.value }}
          generate_release_notes: true
          files: |
            ${{ env.artifact }}
            ${{ env.sha256 }}
