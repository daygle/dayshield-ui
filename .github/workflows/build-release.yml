name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release Tag (e.g. v1.0.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-release:
    name: Build and publish UI artifact
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      NODE_OPTIONS: --no-deprecation

    steps:
      - name: Resolve release tag
        id: tag
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.]+)?$ ]]; then
            echo "Invalid release tag: $TAG"
            exit 1
          fi
          echo "value=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Checkout source
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 1
          ref: ${{ steps.tag.outputs.value }}

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build UI
        env:
          GITHUB_RELEASE_TAG: ${{ steps.tag.outputs.value }}
        run: npm run build

      - name: Package artifact
        id: package
        run: |
          set -euo pipefail
          TAG="${{ steps.tag.outputs.value }}"
          ARTIFACT="ui-${TAG}.tar.zst"
          tar --use-compress-program="zstd -T0 -19" -cf "${ARTIFACT}" dist
          sha256sum "${ARTIFACT}" > "${ARTIFACT}.sha256"
          echo "artifact=${ARTIFACT}" >> "$GITHUB_OUTPUT"
          echo "sha256=${ARTIFACT}.sha256" >> "$GITHUB_OUTPUT"

      - name: Ensure GitHub Release exists
        run: |
          set -euo pipefail
          TAG="${{ steps.tag.outputs.value }}"
          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists."
          else
            gh release create "${TAG}" \
              --title "UI ${TAG}" \
              --generate-notes
          fi

      - name: Upload release assets
        run: |
          set -euo pipefail
          TAG="${{ steps.tag.outputs.value }}"
          gh release upload "${TAG}" \
            "${{ steps.package.outputs.artifact }}" \
            "${{ steps.package.outputs.sha256 }}" \
            --clobber
