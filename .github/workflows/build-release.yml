name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release Tag (e.g. v1.0.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-release:
    name: Build and publish UI artifact
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      NODE_OPTIONS: --no-deprecation

    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Resolve release tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "value=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Build UI
        env:
          GITHUB_RELEASE_TAG: ${{ steps.tag.outputs.value }}
        run: npm run build

      - name: Package artifact
        run: |
          TAG="${{ steps.tag.outputs.value }}"
          ARTIFACT="ui-${TAG}.tar.zst"
          tar --use-compress-program="zstd -T0 -19" -cf "${ARTIFACT}" dist
          sha256sum "${ARTIFACT}" > "${ARTIFACT}.sha256"
          echo "artifact=${ARTIFACT}" >> "$GITHUB_ENV"
          echo "sha256=${ARTIFACT}.sha256" >> "$GITHUB_ENV"

      - name: Ensure GitHub Release exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.tag.outputs.value }}"
          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists."
          else
            gh release create "${TAG}" \
              --title "UI ${TAG}" \
              --generate-notes
          fi

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.tag.outputs.value }}"
          gh release upload "${TAG}" \
            "${{ env.artifact }}" \
            "${{ env.sha256 }}" \
            --clobber
